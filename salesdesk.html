<style>

  --r:4px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

  --rail:#06101F; --rail-fg:#9FBADF; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0B1628; --card:#122039; --fg:#E6ECF4; --muted:#9AA8BB; --line:#24395C; --soft:#172A47;

html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--font);-webkit-text-size-adjust:100%}
*{box-sizing:border-box}

.pill.g{background:rgba(0,192,139,.16);color:var(--good)} .pill.w{background:rgba(196,127,0,.14);color:var(--warn)} .pill.b{background:rgba(196,61,61,.14);color:var(--bad)} .pill.n{background:var(--navy);color:#fff}

.btn:hover{border-color:var(--muted)} .btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--green);outline-offset:1px}

<script>
/* ===================== FSP SalesDesk — core ===================== */
'use strict';
const APP_VERSION='0.37.0';
const STAGES=[
  {id:'lead',name:'Lead',p:.10},{id:'qualified',name:'Qualified',p:.25},{id:'quoted',name:'Quoted',p:.45},
  {id:'proposal',name:'Proposal',p:.60},{id:'verbal',name:'Verbal / Pending',p:.80}];
const STAGE_BY=Object.fromEntries(STAGES.map(s=>[s.id,s]));
const LOST_CANON=window.LOST_CANON=[
 ['Data cleanup',/cleanup|clean up|duplicate|^n\/?a$|^lost$|test|^-+$/i],
 ['No bid',/no bid|did not bid|didn'?t bid|declined to bid|not bid|passed on|chose not to/i],
 ['Funding / timing',/fund|timing|timeline|time ?frame|too long|budget cycle|later|postpone|defer|delay|next year|on hold|waiting until|2024 budget|2025 budget/i],
 ['No response',/no response|unresponsive|ghost|no answer|never heard|not respond|no reply|went dark/i],
 ['No decision / shelved',/no decision|shelved|cancel|scrapped|not moving|dead|abandon|did nothing|not ready|did not want|didn'?t want|did not approve|not approve|not proceed|didn'?t proceed|decided not|no longer/i],
 ['Price',/price|pricing|cheaper|out ?bid|low bid|lower bid|under bid|not low|budget|too high|expensive|cost|lost by \$/i],
 ['Lost to competitor',/competitor|went with|awarded to|lost to|another (vendor|contractor)|incumbent|other company|carrier|trane|johnson controls|jci/i],
 ['Scope / fit',/scope|fit|capab|not our|out of (area|scope)|qualif|too small|too big/i],
 ['Relationship',/relationship|contact left|new management|owner/i]];
const isRealLoss=d=>d.status==='lost'&&canonLost(d.lostReason)!=='Data cleanup';

  const tabs=`<div class="tabs">${[['board','Board'],['list','List'],['forecast','Forecast'],['closed','Won / Lost']].map(([k,l])=>`<button class="${tab===k?'on':''}" data-tab="pipeTab:${k}">${l}</button>`).join('')}</div>`;
  let body='';
  if(tab==='board'){
    body=`<div class="board">${STAGES.map(s=>{const cs=ds.filter(d=>dealStage(d)===s.id).sort((a,b)=>(a.close||'9')>(b.close||'9')?1:-1);const tot=cs.filter(d=>d.value<5e7).reduce((a,d)=>a+(d.value||0),0);
      return `<div class="col" data-stage="${s.id}"><h3>${s.name} <span class="num">${cs.length} · ${fmtK(tot)}</span></h3>${cs.map(d=>{const late=d.close&&d.close<todayISO();return `<div class="dc ${d.value>=5e7?'flag':late?'late':''}" draggable="true" data-id="${d.id}" data-go="deal:deal:${d.id}"><div class="t">${esc(d.title)}</div><div class="muted">${esc(orgName(d.org))}</div><div class="m"><span>${brandDot(d.brand)}${esc((d.owner||'').split(' ')[0])}</span><span class="v num">${fmtK(d.value)}</span></div><div class="m"><span>${d.line==='maintenance'?'<span class="pill">PM</span>':''}${d.nextDate?`<span class="num ${d.nextDate<todayISO()?'pill b':'pill'}">next ${d.nextDate.slice(5)}</span>`:''}</span><span class="num ${late?'muted':''}">${d.close||'no date'}</span></div>${canWrite()?`<div class="right" style="margin-top:6px"><button class="btn s" data-act="quickLog" data-id="${d.id}" onclick="event.stopPropagation()">Log</button></div>`:''}</div>`}).join('')||'<div class="empty">Empty</div>'}</div>`}).join('')}</div>
    <small class="hint">Drag a card between columns to change its stage. On a phone, open the deal and change the stage there. Stage probability drives the weighted forecast unless a deal carries its own probability from Pipedrive.</small>`;
  } else if(tab==='list'){
    let lds=ds; if(S.ui.dq){ const chk=DQ_CHECKS.find(c=>c[0]===S.ui.dq.issue); if(chk)lds=lds.filter(chk[2]) }
    const rows=S.ui.sortBid?lds.sort((a,b)=>(a.bidDue||'9')>(b.bidDue||'9')?1:-1):lds.sort((a,b)=>(b.value||0)-(a.value||0));
    body=`${S.ui.dq?`<div class="banner" style="border-color:var(--warn)">Showing deals with: <b>${esc((DQ_CHECKS.find(c=>c[0]===S.ui.dq.issue)||['','?'])[1])}</b>${S.ui.dq.rep?` · ${esc(S.ui.dq.rep)}`:''} (${lds.length}) <button class="btn s" data-act="dqClear">Clear</button></div>`:''}<div class="card pad0 tbl"><table><tr><th>Deal</th><th>Account</th><th>Brand</th><th>Rep</th><th>Stage</th><th class="r">Value</th><th class="r">Prob</th><th>Close</th><th><a href="#" data-act="sortBid" style="text-decoration:none">Bid due ${S.ui.sortBid?'▲':''}</a></th><th></th></tr>
    ${(()=>{const B=brands(),T=todayISO(),cw=canWrite(); return paged('pipeList',rows,d=>`<tr class="row" data-go="deal:deal:${d.id}"><td>${esc(d.title)}${d.line==='maintenance'?' <span class="pill">PM</span>':''}</td><td>${esc(orgName(d.org))}</td><td>${brandDot(d.brand)}${esc(B[d.brand]?.short||d.brand)}</td><td>${esc(d.owner)}</td><td>${STAGE_BY[dealStage(d)].name}</td><td class="r num">${fmt$(d.value)}</td><td class="r num">${pct(dealProb(d))}</td><td class="num ${d.close&&d.close<T?'muted':''}">${d.close||'—'}</td><td class="num">${d.bidDue?`<span class="${d.bidDue<T?'pill b':''}">${d.bidDue}</span>`:''}</td><td>${cw?`<button class="btn s" data-act="quickLog" data-id="${d.id}" onclick="event.stopPropagation()">Log</button>`:''}</td></tr>`,10)})()}</table></div><small class="hint">${rows.length} deals · sorted by ${S.ui.sortBid?'bid due':'value'}</small>`;
  } else if(tab==='forecast'){
    const fy=settings().fiscalYear; const now=new Date(); const m1=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`; const n2=new Date(now.getFullYear(),now.getMonth()+1,1); const m2=`${n2.getFullYear()}-${String(n2.getMonth()+1).padStart(2,'0')}`;
    const snap=prevSnapshot(); const wk=weekMovement(filteredDeals()); const slipsByRep={}; for(const x of wk.slipped){slipsByRep[x.d.owner]=(slipsByRep[x.d.owner]||0)+1}
    const brandTable=m=>{const rows=forecastRoll({month:m,deals:filteredDeals()}); const B=brands(); const by={}; for(const r of rows){ const b=by[r.brand]||(by[r.brand]={brand:r.brand,won:0,commit:0,best:0,wgt:0,plan:0,prev:0,hasPrev:false}); b.won+=r.won;b.commit+=r.commit;b.best+=r.best;b.wgt+=r.wgt;b.plan+=r.plan; if(snap&&snap.month===m&&snap.commitByRep&&snap.commitByRep[r.rep]){b.prev+=snap.commitByRep[r.rep].commit||0;b.hasPrev=true} } const bl=Object.values(by).sort((a,b)=>b.plan-a.plan||b.commit-a.commit); if(bl.length<2)return ''; const tot=bl.reduce((a,b)=>({won:a.won+b.won,commit:a.commit+b.commit,best:a.best+b.best,wgt:a.wgt+b.wgt,plan:a.plan+b.plan,prev:a.prev+b.prev,hasPrev:a.hasPrev||b.hasPrev}),{won:0,commit:0,best:0,wgt:0,plan:0,prev:0,hasPrev:false}); const d=(b)=>b.hasPrev?`<span class="pill ${b.commit-b.prev>=0?'g':'b'}">${b.commit-b.prev>=0?'+':''}${fmtK(b.commit-b.prev)}</span>`:'<span class="muted">—</span>';
      return `<div class="card" style="margin-bottom:12px"><h3>${monthName(+m.slice(5))} by brand</h3><div class="tbl"><table><tr><th>Brand</th><th class="r">Won</th><th class="r">Commit</th><th class="r">Δ commit vs last week</th><th class="r">Best case</th><th class="r">Weighted</th><th class="r">Plan</th><th class="r">Gap after commit</th></tr>${bl.map(b=>`<tr class="row" data-act="setBrand" data-brand="${b.brand}"><td>${brandDot(b.brand)}${esc(B[b.brand]?.short||b.brand)}</td><td class="r num">${fmtK(b.won)}</td><td class="r num">${fmtK(b.commit)}</td><td class="r num">${d(b)}</td><td class="r num">${fmtK(b.best)}</td><td class="r num">${fmtK(b.wgt)}</td><td class="r num">${b.plan?fmtK(b.plan):'—'}</td><td class="r num">${b.plan?`<span class="pill ${b.plan-b.won-b.commit<=0?'g':b.plan-b.won-b.commit<b.plan*.3?'w':'b'}">${fmtK(b.plan-b.won-b.commit)}</span>`:'—'}</td></tr>`).join('')}<tr><td><b>Platform</b></td><td class="r num"><b>${fmtK(tot.won)}</b></td><td class="r num"><b>${fmtK(tot.commit)}</b></td><td class="r num">${d(tot)}</td><td class="r num"><b>${fmtK(tot.best)}</b></td><td class="r num"><b>${fmtK(tot.wgt)}</b></td><td class="r num"><b>${fmtK(tot.plan)}</b></td><td class="r num"><b>${fmtK(tot.plan-tot.won-tot.commit)}</b></td></tr></table></div><small class="hint">Δ compares each rep's commit with the ${snap?snap.week+' snapshot':'last weekly snapshot (none yet)'}; brands with one rep roll up to that rep.</small></div>`};
    const fcTable=m=>{const rows=forecastRoll({month:m,deals:filteredDeals()}); const tot=rows.reduce((a,r)=>({commit:a.commit+r.commit,best:a.best+r.best,wgt:a.wgt+r.wgt,plan:a.plan+r.plan,won:a.won+r.won}),{commit:0,best:0,wgt:0,plan:0,won:0}); return `<div class="card"><h3>${monthName(+m.slice(5))} ${m.slice(0,4)} · commit ${fmtK(tot.commit)} · best ${fmtK(tot.best)} · weighted ${fmtK(tot.wgt)} <span class="muted" style="font-weight:400">(${forecastBasis()==='stage'?'stage-weighted':'imported probability'})</span> · plan ${fmtK(tot.plan)}${tot.won?` · won so far ${fmtK(tot.won)}`:''}</h3><div class="tbl"><table><tr><th>Rep</th><th>Brand</th><th class="r">Won</th><th class="r">Commit</th><th class="r">Best case</th><th class="r">Weighted</th><th class="r">Plan</th><th class="r">Gap after commit</th><th class="r">Slipped (wk)</th></tr>${rows.map(r=>`<tr><td><a href="#" data-act="repModal" data-name="${esc(r.rep)}">${esc(r.rep)}</a></td><td>${brandDot(r.brand)}</td><td class="r num">${fmtK(r.won)}</td><td class="r num">${fmtK(r.commit)}</td><td class="r num">${fmtK(r.best)}</td><td class="r num">${fmtK(r.wgt)}</td><td class="r num">${r.plan?fmtK(r.plan):'<span class="muted">—</span>'}</td><td class="r num">${r.plan?`<span class="pill ${r.gap<=0?'g':r.gap<r.plan*.3?'w':'b'}">${fmtK(r.gap)}</span>`:'—'}</td><td class="r num">${slipsByRep[r.rep]?`<span class="pill w">${slipsByRep[r.rep]}</span>`:'<span class="muted">0</span>'}</td></tr>`).join('')}</table></div></div>`};
    body=`<div class="banner">Commit = deals the rep will stand behind this month (default: Verbal stage). Best case adds Proposal-stage deals. Set a deal's forecast category from the quick log or the deal edit form; omit excludes it. Gap = plan − won − commit.</div>${brandTable(m1)}${fcTable(m1)}<div style="height:12px"></div>${fcTable(m2)}
    <div class="sec"><h2>Weighted by close month</h2></div>`;
    const months={}; for(const d of ds){ if(d.value>=5e7)continue; const m=d.close?ym(d.close):'unscheduled'; const o=months[m]||(months[m]={n:0,v:0,w:0}); o.n++; o.v+=d.value||0; o.w+=(d.value||0)*dealProb(d) }
    const keys=Object.keys(months).sort(); const max=Math.max(...keys.map(k=>months[k].v),1);
    body+=`<div class="card"><div class="tbl"><table><tr><th>Close month</th><th class="r">Deals</th><th class="r">Gross</th><th class="r">Weighted</th><th style="width:40%">Gross vs weighted</th></tr>
    ${keys.map(k=>`<tr><td>${k}</td><td class="r num">${months[k].n}</td><td class="r num">${fmtK(months[k].v)}</td><td class="r num">${fmtK(months[k].w)}</td><td><div class="bar" style="height:12px;position:relative"><i style="width:${months[k].v/max*100}%;background:var(--sky)"></i><i style="width:${months[k].w/max*100}%;position:absolute;left:0;top:0"></i></div></td></tr>`).join('')}</table></div>
    <small class="hint">Light bar = gross value, green = stage-weighted. Deals with a past close date still show in their original month; move them or close them out.</small></div>`;
  } else {
    const all=filteredDeals().filter(d=>d.status!=='open'&&((d.won||'').startsWith(String(settings().fiscalYear))||d.lostYear==settings().fiscalYear)).sort((a,b)=>((b.won||b.created||'')>(a.won||a.created||'')?1:-1));
    const B=brands(); body=`<div class="card pad0 tbl"><table><tr><th>Deal</th><th>Account</th><th>Brand</th><th>Rep</th><th>Result</th><th class="r">Value</th><th>When</th></tr>${paged('closed',all,d=>`<tr class="row" data-go="deal:deal:${d.id}"><td>${esc(d.title)}</td><td>${esc(orgName(d.org))}</td><td>${brandDot(d.brand)}${esc(B[d.brand]?.short||d.brand)}</td><td>${esc(d.owner)}</td><td><span class="pill ${d.status==='won'?'g':'b'}">${d.status}</span></td><td class="r num">${fmt$(d.value)}</td><td class="num">${d.won||d.lostYear||''}</td></tr>`,7)}</table></div><small class="hint">${all.length} closed in FY${settings().fiscalYear}</small>`;
  }
  return `<div class="topbar"><h1>Pipeline</h1><button class="btn p" data-act="newDeal">+ New deal</button></div>${filterBar()}${tabs}${hidden.length?`<div class="banner">${hidden.filter(d=>d.paused).length} paused and ${hidden.filter(d=>d.value>=5e7).length} outlier-value deals are kept off the board. <a href="#analytics" data-go="analytics" data-tab="anaTab:aging">See them under Aging</a>.</div>`:''}${body}`;
}
function wireBoard(){
  $$('.dc[draggable]').forEach(c=>{c.ondragstart=e=>{e.dataTransfer.setData('text/plain',c.dataset.id);e.dataTransfer.effectAllowed='move'}});
  $$('.col[data-stage]').forEach(col=>{col.ondragover=e=>{if(!canWrite())return;e.preventDefault();col.classList.add('over')};col.ondragleave=()=>col.classList.remove('over');
    col.ondrop=async e=>{e.preventDefault();col.classList.remove('over');const id=e.dataTransfer.getData('text/plain');const d=S.dealById.get(id);if(!d||d.stage===col.dataset.stage)return;await setStage(d,col.dataset.stage)}});
}
function stampClose(upd,prev){ const a=prev.close||null,b=upd.close||null; if(a===b)return upd; upd.closeHistory=[...(prev.closeHistory||[]),{from:a,to:b,at:nowISO(),by:whoami()}].slice(-20); return upd }
function slipsSince(ds,sinceISO){ const out=[]; for(const d of ds){ if(d.status!=='open'||!d.closeHistory)continue; for(const h of d.closeHistory){ if((h.at||'')<sinceISO||!h.from||!h.to||h.to<=h.from)continue; out.push({d,from:h.from,to:h.to,days:Math.round((new Date(h.to)-new Date(h.from))/864e5),at:h.at}) } } return out.sort((a,b)=>b.days-a.days) }
function stampStage(upd,prev,stage){ if(stage&&stage!==dealStage(prev)){ upd.stage=stage; upd.prob=null; upd.stageAt={...(prev.stageAt||{}),[stage]:todayISO()}; upd.stageChangedAt=todayISO() } return upd }
async function setStage(d,stage){ if(!canEditDeal(d)){toast('You can change stage only on your own deals',true);return} const ok=await dbWrite('deals',d.id,stampStage({...d},d,stage),false); if(ok){addActivity(d.id,'stage',`Stage → ${STAGE_BY[stage].name}`);toast(`${d.title} → ${STAGE_BY[stage].name}`);render()} }

function resolveOrg(name){ name=(name||'').trim(); if(!name)return null; const n=name.toLowerCase(); let o=S.orgsAll.find(x=>x.name.toLowerCase()===n)||S.orgsAll.find(x=>(x.aliases||[]).some(a=>a.toLowerCase()===n)); if(o)return o.id;
  const id='org_'+slug(name).slice(0,40)+'-'+Date.now().toString(36).slice(-3); dbWrite('orgs',id,{id,name,aliases:[],brands:[],mergeStatus:'single',createdBy:S.me.name||'local'},false); return id }

      <b>Last touch</b><span>${lastTouch(d)?`${daysSince(lastTouch(d))} days ago`:'—'}${d.stageChangedAt?` · in stage ${daysSince(d.stageChangedAt+'T00:00:00Z')} days${(d.stageSource==='pipedrive'||d.stageSource==='probability'||(d.pdStageName&&d.stageChangedAt<'2026-06-24'))?' <span class="muted">(as of June 23 export)</span>':''}`:''}${d.stageConflict?` <span class="pill w" title="Pipedrive showed '${esc(d.pdStageName||'')}' in June; the October probability (${pct(d.prob)}) places it here">stage conflict</span>`:''}</span>
      <b>Contact</b><span>${esc(d.contact||'—')} ${contactLinks(d.contact)}${(()=>{if(d.org==='org_no-organization')return ''; const cs=S.contacts.filter(c=>c.orgId===d.org&&c.id!==d.contactId&&(c.phone||c.email||c.title)); return cs.length?`<div style="margin-top:6px">${cs.slice(0,4).map(c=>`<div class="muted">${esc(c.name)}${c.title?', '+esc(c.title):''} ${contactLinks([c.phone,c.email].filter(Boolean).join(' '))}</div>`).join('')}</div>`:''})()}</span>

  return `<div class="svgwrap"><svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:${Math.min(W,data.length*44)}px;display:block">${g}${bars}</svg></div>`;
}
/* ===================== GPMD & plan ===================== */
function viewPlan(){
  const tab=S.ui.planTab; const fy=settings().fiscalYear; const m=new Date().getMonth()+1;
  const tabs=`<div class="tabs">${[['gpmd','Capacity (man-days)'],['goals','Goals vs actual'],['reps','Rep plans']].map(([k,l])=>`<button class="${tab===k?'on':''}" data-tab="planTab:${k}">${l}</button>`).join('')}</div>`;
  let body='';
  if(tab==='gpmd'){
    const bk=S.ui.brand||(opBrands()[0]||{}).key; const g=gpmdFor(bk); const cap=g.fieldTechs*g.workingDaysPerMonth;
    const months=[]; for(let i=0;i<6;i++){const d=new Date();d.setMonth(d.getMonth()+i);months.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`)}
    const quotes=Object.values(S.live.quotes).filter(q=>q.brand===bk); const load={}; const wonLoad={}; const over={won:0,wgt:0,n:0};
    const byDeal={}; for(const q of quotes){ if(['declined','expired'].includes(q.status))continue; const d=S.dealById.get(q.dealId); if(!d||d.status==='lost')continue; const cur=byDeal[d.id]; if(!cur||(d.quoteId===q.id)||(cur.q.id!==d.quoteId&&(q.updatedAt||q.createdAt||'')>(cur.q.updatedAt||cur.q.createdAt||'')))byDeal[d.id]={q,d} }
    for(const {q,d} of Object.values(byDeal)){ const c=quoteCalc(q); const mm=ym(q.installStart); const w=d.status==='won'?c.manDays:c.manDays*dealProb(d); if(!mm||mm<months[0]){ over[d.status==='won'?'won':'wgt']+=w; over.n++; continue } if(d.status==='won'){wonLoad[mm]=(wonLoad[mm]||0)+c.manDays} else {load[mm]=(load[mm]||0)+w} }
    const rows=[{k:'Overdue / unscheduled',won:over.won,wgt:over.wgt,over:true},...months.map(mm=>({k:monthName(+mm.slice(5)),won:wonLoad[mm]||0,wgt:load[mm]||0}))];
    const live=S.live.settings.main?.gpmd||{}; const techsSet=(live.default&&live.default.fieldTechs)||(live[bk]&&live[bk].fieldTechs);
    const scored=quotes.map(q=>({q,c:quoteCalc(q),d:S.dealById.get(q.dealId)})).filter(x=>x.c.manDays);
    const avgG=scored.length?scored.reduce((a,x)=>a+x.c.gp,0)/scored.reduce((a,x)=>a+x.c.manDays,0):null;
    body=`<div class="banner">GPMD discipline, platform-wide: price every job against gross profit per field man-day, set the floor from overhead ÷ billable man-days, and load backlog in man-days against crews on hand. Brand: ${sel('b',opBrands().map(b=>[b.key,b.short]),bk,'data-filter="brand" style="width:auto"')}</div>
    <div class="grid g4">${statCard(fmt$(g.requiredGpmd),'Required GPMD','Overhead ÷ billable man-days (Setup)')}${statCard(avgG!=null?fmt$(avgG):'—','Blended GPMD on quotes',`${scored.length} quotes scored`)}${statCard(cap.toLocaleString(),'Man-days capacity / month',techsSet?`${g.fieldTechs} field techs × ${g.workingDaysPerMonth} days`:`<span class="pill w">default assumption</span> ${g.fieldTechs} techs × ${g.workingDaysPerMonth} days, set in Setup`)}${statCard(scored.filter(x=>x.c.verdict==='pass').length,'Quotes below floor','Pass or reprice before sending')}</div>
    <div class="sec"><h2>Backlog load vs capacity</h2></div>
    <div class="card"><div class="tbl"><table><tr><th>Month</th><th class="r">Won man-days</th><th class="r">Weighted open</th><th class="r">Total</th><th class="r">Capacity</th><th style="width:35%">Load</th><th>Signal</th></tr>${rows.map(r=>{const t=r.won+r.wgt;const u=t/cap; if(r.over)return `<tr><td>${r.k}</td><td class="r num">${Math.round(r.won)}</td><td class="r num">${Math.round(r.wgt)}</td><td class="r num">${Math.round(t)}</td><td class="r num muted">—</td><td></td><td>${t?'<span class="pill w">Set install start</span>':'<span class="muted">none</span>'}</td></tr>`; return `<tr><td>${r.k}</td><td class="r num">${Math.round(r.won)}</td><td class="r num">${Math.round(r.wgt)}</td><td class="r num">${Math.round(t)}</td><td class="r num">${cap}</td><td><div class="bar" style="height:12px"><i style="width:${Math.min(100,u*100)}%;background:${u>1?'var(--bad)':u>.85?'var(--warn)':'var(--green)'}"></i></div></td><td>${u>1?'<span class="pill b">Hire / OT / raise price</span>':u>.85?'<span class="pill w">Near full</span>':u<.5?'<span class="pill">Sell harder</span>':'<span class="pill g">Healthy</span>'}</td></tr>`}).join('')}</table></div><small class="hint">Man-days come from quotes attached to deals (crew × days, or visits × hours for agreements), placed in the quote's install start month; one quote per deal (the deal's selected quote), declined and expired quotes excluded; undated or past-month load sits in the first row until an install start is set. Open deals are weighted by stage probability. Quote every real bid and this becomes the hiring signal.</small></div>
    <div class="sec"><h2>Scored bids</h2></div>
    ${scored.length?`<div class="card pad0 tbl"><table><tr><th>Quote</th><th>Rep</th><th>Status</th><th class="r">Price</th><th class="r">Man-days</th><th class="r">GPMD</th><th>Verdict</th></tr>${scored.sort((a,b)=>(a.c.gpmd||0)-(b.c.gpmd||0)).map(x=>`<tr class="row" data-go="quote:quote:${x.q.id}"><td>${esc(x.q.title)}</td><td>${esc(x.d?.owner||'')}</td><td>${esc(x.d?.status||'')}</td><td class="r num">${fmtK(x.c.price)}</td><td class="r num">${x.c.manDays}</td><td class="r num">${fmt$(x.c.gpmd)}</td><td>${verdictPill(x.c.verdict,x.q&&x.q.brand)}</td></tr>`).join('')}</table></div>`:'<div class="empty">No quotes for this brand yet.</div>'}`;
  } else if(tab==='goals'){
    const bk=S.ui.brand; const plans=S.plans?S.plans.companyPlans.filter(g=>!bk||g.brand===bk):[];
    const perM=Array.from({length:12},(_,i)=>({m:i+1,plan:0,qplan:0,won:0,quoted:0}));
    for(const g of plans){perM[g.month-1].plan+=g.ordersPlan;perM[g.month-1].qplan+=g.quotesPlan}
    for(const d of S.deals){ if(bk&&d.brand!==bk)continue; if(d.value>=5e7)continue; if(d.status==='won'&&(d.won||'').startsWith(fy)){perM[+d.won.slice(5,7)-1].won+=d.value} if((d.created||'').startsWith(fy)){perM[+d.created.slice(5,7)-1].quoted+=d.value} }
    const ytd=perM.slice(0,m); const sum=k=>ytd.reduce((a,r)=>a+r[k],0);
    body=`<div class="grid g4">${statCard(fmtK(sum('won')),`Orders YTD`,`${pct(sum('plan')?sum('won')/sum('plan'):null)} of ${fmtK(sum('plan'))} plan`,sum('won')>=sum('plan')*.9?'good':'')}${statCard(fmtK(sum('quoted')),'Quoted YTD (deals created)',`${pct(sum('qplan')?sum('quoted')/sum('qplan'):null)} of ${fmtK(sum('qplan'))} quote plan`)}${statCard(pct(sum('quoted')?sum('won')/sum('quoted'):null),'Realized close rate','Plan assumes 35%')}${statCard(fmtK(perM.reduce((a,r)=>a+r.plan,0)),`FY${fy} orders plan`,'Company plan, all lines')}</div>
    <div class="sec"><h2>Orders by month: won vs plan</h2></div><div class="card">${barChart(perM.map(r=>({k:monthName(r.m),v:r.won,plan:r.plan})))}<small class="hint">Bars = won value by won month. Sky line = orders plan for that month.</small></div>
    <div class="sec"><h2>Quoting by month: created vs quote plan</h2></div><div class="card">${barChart(perM.map(r=>({k:monthName(r.m),v:r.quoted,plan:r.qplan,color:'var(--sky)'})))}</div>`;
  } else {
    const bk=S.ui.brand; const goals=S.plans?S.plans.goals.filter(g=>(!bk||g.brand===bk)&&g.month<=m):[];
    const byRep={}; for(const g of goals){const nm=planOwner(g.rep); const r=byRep[nm]||(byRep[nm]={rep:nm,brand:g.brand,plan:0,qplan:0,won:0,quoted:0,open:0});r.plan+=g.ordersPlan;r.qplan+=g.quotesPlan}
    for(const d of S.deals){ if(bk&&d.brand!==bk)continue; if(d.value>=5e7||!d.owner)continue; const active=d.status==='open'||(d.status==='won'&&(d.won||'').startsWith(fy)); if(!byRep[d.owner]&&!active)continue; const r=byRep[d.owner]||(byRep[d.owner]={rep:d.owner,brand:d.brand,plan:0,qplan:0,won:0,quoted:0,open:0,noPlan:true}); if(d.status==='won'&&(d.won||'').startsWith(fy))r.won+=d.value; if((d.created||'').startsWith(fy))r.quoted+=d.value; if(d.status==='open')r.open+=d.value }
    const rows=Object.values(byRep).filter(r=>!/new hire|mgmt/i.test(r.rep)).sort((a,b)=>b.plan-a.plan||b.open-a.open);
    body=`<div class="card pad0 tbl"><table><tr><th>Rep</th><th>Brand</th><th class="r">Orders plan YTD</th><th class="r">Won YTD</th><th class="r">Attain</th><th class="r">Quote plan YTD</th><th class="r">Quoted YTD</th><th class="r">Open pipeline</th><th class="r">Coverage</th></tr>${rows.map(r=>{const gap=Math.max(0,r.plan-r.won);return `<tr><td><a href="#" data-act="repModal" data-name="${esc(r.rep)}">${esc(r.rep)}</a></td><td>${brandDot(r.brand)}</td><td class="r num">${r.noPlan?'<span class="muted">no plan</span>':fmtK(r.plan)}</td><td class="r num">${fmtK(r.won)}</td><td class="r num">${r.plan?`<span class="pill ${r.won/r.plan>=.9?'g':r.won/r.plan>=.7?'w':'b'}">${pct(r.won/r.plan)}</span>`:'—'}</td><td class="r num">${fmtK(r.qplan)}</td><td class="r num">${fmtK(r.quoted)}</td><td class="r num">${fmtK(r.open)}</td><td class="r num">${gap?`${(r.open*.35/gap).toFixed(1)}x`:'<span class="pill g">on plan</span>'}</td></tr>`}).join('')}</table></div><small class="hint">Coverage = open pipeline × 35% close rate ÷ remaining gap to YTD orders plan. Below 1.0x the rep cannot close the gap from what is in the funnel.</small>`;
  }
  return `<div class="topbar"><h1>GPMD & plan</h1></div>${tab!=='gpmd'?filterBar():''}${tabs}${body}`;
}

      execute:({brand,owner})=>{const fy=settings().fiscalYear;const o={};for(const d of visibleDeals()){if(d.status!=='lost'||!d.lostReason||(d.lostYear&&d.lostYear<fy-1))continue;if(brand&&d.brand!==brand)continue;if(owner&&!(d.owner||'').toLowerCase().includes(owner.toLowerCase()))continue;const k=canonLost(d.lostReason);if(k==='Data cleanup')continue;const r=o[k]||(o[k]={reason:k,n:0,value:0,examples:[]});r.n++;r.value+=d.value||0;if(r.examples.length<3&&!r.examples.includes(d.lostReason))r.examples.push(d.lostReason)}return Object.values(o).sort((a,b)=>b.n-a.n)}},

      execute:({brand})=>{const o={};for(const d of visibleDeals()){if(brand&&d.brand!==brand)continue;if(d.value>=5e7)continue;const k=d.vertical||'(not set)';const v=o[k]||(o[k]={vertical:k,open:0,openValue:0,won:0,wonValue:0,lost:0,pmWon:0,projectWon:0});if(d.status==='open'){v.open++;v.openValue+=d.value}else if(d.status==='won'){v.won++;v.wonValue+=d.value;if(d.line==='maintenance')v.pmWon+=d.value;else v.projectWon+=d.value}else v.lost++}return Object.values(o).sort((a,b)=>b.wonValue-a.wonValue)}},
    {name:'rep_scorecard',description:'Per-rep FY results and plan attainment for all reps or one brand.',inputSchema:{type:'object',properties:{brand:{type:'string'}}},
      execute:({brand})=>{const fy=settings().fiscalYear;const m=new Date().getMonth()+1;const out={};for(const g of (S.plans?.goals||[])){if(brand&&g.brand!==brand)continue;if(g.month>m)continue;const nm=planOwner(g.rep);const r=out[nm]||(out[nm]={rep:nm,brand:g.brand,planYTD:0,won:0,open:0});r.planYTD+=g.ordersPlan}for(const d of visibleDeals()){if(brand&&d.brand!==brand)continue;const r=out[d.owner]||(out[d.owner]={rep:d.owner,brand:d.brand,planYTD:0,won:0,open:0});if(d.value>=5e7)continue;if(d.status==='won'&&(d.won||'').startsWith(fy))r.won+=d.value;if(d.status==='open')r.open+=d.value}return Object.values(out).filter(r=>r.won||r.open||r.planYTD)}}
  ];
}
