name: Deploy FSP SalesDesk to Azure Static Web Apps
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Build the web app from salesdesk.html
        run: python3 deploy/azure-swa/tools/build_web.py salesdesk.html data deploy/azure-swa/app
      - name: Fill the tenant id into the SWA config
        run: sed -i "s/__TENANT_ID__/${{ secrets.AAD_TENANT_ID }}/" deploy/azure-swa/staticwebapp.config.json && cp deploy/azure-swa/staticwebapp.config.json deploy/azure-swa/app/staticwebapp.config.json
      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: deploy/azure-swa/app
          api_location: deploy/azure-swa/api
          skip_app_build: true
